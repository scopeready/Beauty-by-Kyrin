name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# This workflow only checks the code. It never deploys: Vercel builds from its
# own Git integration, so nothing here should publish anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only devDependencies exist — the site itself ships with zero runtime
      # dependencies, so this stays fast.
      - name: Install
        run: npm ci

      - name: Typecheck the booking API
        run: npm run typecheck

      - name: Syntax-check browser and template code
        run: node --check script.js && node --check templates.mjs

      # The booking endpoint is the revenue path: validation, spam handling and
      # rate limiting are asserted directly, with delivery stubbed out.
      - name: Test the booking endpoint
        run: npm run test:api

      - name: Build
        run: npm run build

      # verify.mjs asserts against the real built HTML: metadata, the JSON-LD
      # graph, sitemap, internal links, every referenced asset, form labels, and
      # that no unverified schema property (reviews, ratings, geo, credentials)
      # ever reaches a page.
      - name: Verify the built site
        run: npm run verify

      - name: Verify drafts also build
        run: PUBLISH_DRAFTS=true npm run build && PUBLISH_DRAFTS=true npm run verify

      - name: Check for secrets in tracked files
        run: |
          if git grep -nIE '(SUPABASE_SERVICE_ROLE_KEY|GOOGLE_SITE_VERIFICATION)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']+' -- . ':!.env.example' ':!docs'; then
            echo "::error::A secret appears to be committed."
            exit 1
          fi
          echo "No committed secrets found."
